{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card auth-card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Вход в систему</h2>
                        <p class="text-muted">Введите ваши учетные данные</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control form-control-lg" 
                                   id="email" name="email" required
                                   placeholder="ваш@email.com">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <input type="password" class="form-control form-control-lg" 
                                   id="password" name="password" required
                                   placeholder="••••••••">
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" 
                                   id="remember" name="remember">
                            <label class="form-check-label" for="remember">
                                Запомнить меня
                            </label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Войти
                            </button>
                        </div>

                        <div class="text-center mb-3">
                            <a href="#" class="text-decoration-none">Забыли пароль?</a>
                        </div>

                        <div class="text-center">
                            <p class="mb-0">Еще нет аккаунта? 
                                <a href="{{ url_for('register') }}" class="text-decoration-none">
                                    Зарегистрироваться
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
