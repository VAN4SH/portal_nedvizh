{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card auth-card shadow-sm border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Регистрация</h2>
                        <p class="text-muted">Создайте новый аккаунт</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control form-control-lg" 
                                       id="username" name="username" required
                                       placeholder="ivanov">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" 
                                       id="email" name="email" required
                                       placeholder="ваш@email.com">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="password" name="password" required
                                       placeholder="••••••••">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control form-control-lg" 
                                       id="confirm_password" name="confirm_password" required
                                       placeholder="••••••••">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон (необязательно)</label>
                            <input type="tel" class="form-control form-control-lg" 
                                   id="phone" name="phone"
                                   placeholder="+7 (999) 123-45-67">
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" 
                                   id="is_agent" name="is_agent">
                            <label class="form-check-label" for="is_agent">
                                Я агент по недвижимости
                            </label>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Зарегистрироваться
                            </button>
                        </div>

                        <div class="text-center">
                            <p class="mb-0">Уже есть аккаунт? 
                                <a href="{{ url_for('login') }}" class="text-decoration-none">
                                    Войти
                                </a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
